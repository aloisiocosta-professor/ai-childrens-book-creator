services:
  - type: web
    name: book-creator-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: book-creator-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TEXT_MODEL
        value: gpt-6.2-astra
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2.5-flare
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_SSL
        value: "false"

databases:
  - name: book-creator-db
    plan: free
    databaseName: book_creator
    user: book_creator_app
    ipAllowList: []
